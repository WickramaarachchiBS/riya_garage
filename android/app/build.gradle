plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "flutter.plugins.directcaller"
    namespace = "com.example.riya_garage"

    // Use fixed compileSdkVersion to address warnings or potential compatibility issues
    compileSdkVersion = flutter.compileSdkVersion// Use a specific SDK version instead of flutter.compileSdkVersion

    ndkVersion = "29.0.13113456"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Set a fixed targetSdkVersion
        targetSdkVersion 34  // Use a specific SDK version instead of flutter.targetSdkVersion
        applicationId = "com.example.riya_garage"

        minSdk = flutter.minSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
